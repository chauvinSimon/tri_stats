[project]
name = "tri-stats"
version = "0.1.0"
description = "Analyse data of the World Triathlon (formerly ITU) to try to answer key questions about elite triathlon. 🏊🚴🏃"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
]
